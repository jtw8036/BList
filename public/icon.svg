<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Horizontal/Diagonal Pink -> Purple -> Blue Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="35%" stop-color="#D926FF" />
      <stop offset="70%" stop-color="#6B38FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#D926FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Clean Pure White Rounded Background -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF" />

  <!-- Thick Continuous Line Drawing Heart -->
  <g filter="url(#soft-glow)" transform="translate(0, 15)">
    <path
      d="M 90, 395
         C 165, 410 230, 390 256, 335
         C 195, 230 75, 135 135, 88
         C 185, 48 240, 115 256, 165
         C 272, 115 327, 48 377, 88
         C 437, 135 317, 230 256, 335
         C 282, 390 347, 410 422, 395"
      fill="none"
      stroke="url(#line-grad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
