
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6596"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9F1239" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background fill (Solid without transparency for iOS PWA icon) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative inner glow card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="white" fill-opacity="0.1"/>

  <!-- Main Heart Icon -->
  <g filter="url(#shadow)">
    <path d="M256 420C256 420 80 300 80 185C80 125 125 80 185 80C222 80 245 100 256 118C267 100 290 80 327 80C387 80 432 125 432 185C432 300 256 420 256 420Z" fill="url(#heartGrad)"/>
  </g>

  <!-- Couples Text Logo Badge inside heart -->
  <text x="256" y="245" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="64" fill="#F43F5E" letter-spacing="2">T♥S</text>
</svg>
